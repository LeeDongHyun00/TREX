# 테스트 전용 설정 — 비밀값이 없으므로 커밋한다. 실제 로컬·운영 설정은 src/main/resources/application.yml(git 제외)·application-prod.yml.
spring:
  datasource:
    url: jdbc:h2:mem:trex_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  servlet:
    multipart:
      # 커뮤니티 사진: 장당 2MB, 글 하나(사진 5장 + 본문) 11MB 까지. 넘으면 413.
      max-file-size: 2MB
      max-request-size: 11MB

jwt:
  secret: test_only_secret_key_at_least_32_bytes_long_0123456789
  expiration_time: 3600000

trex:
  oauth:
    google:
      client-ids: test-web-client-id.apps.googleusercontent.com
  community:
    admin-login-ids: google_admin-sub
