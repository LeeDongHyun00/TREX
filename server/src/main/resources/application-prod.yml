# 운영(AWS) 설정 — SPRING_PROFILES_ACTIVE=prod 로 켠다. docs/SERVER_SYNC_HANDOFF.md D9·D10.
# 시크릿은 이 파일에 쓰지 않는다(공개 저장소). 전부 환경변수로 주입하고, 빠지면 서버가 뜨지 않게 기본값을 두지 않는다.

spring:
  datasource:
    url: ${DB_URL}            # 예: jdbc:postgresql://<RDS 엔드포인트>:5432/trex
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # create 는 재시작마다 데이터를 지운다. 마이그레이션 도구(Flyway) 도입 전까지는 update 로 컬럼 추가만 따라간다.
      ddl-auto: update
    show-sql: false

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      # 커뮤니티 사진: 장당 2MB, 글 하나(사진 5장 + 본문) 11MB 까지. 넘으면 413.
      max-file-size: 2MB
      max-request-size: 11MB

server:
  # Caddy(HTTPS 종료) 뒤에서 X-Forwarded-* 를 믿는다. 앱 포트는 외부에 열지 않는다.
  forward-headers-strategy: framework

jwt:
  secret: ${JWT_SECRET}
  expiration_time: 2592000000 # 30일 — 앱은 만료되면 다시 소셜 로그인한다

trex:
  oauth:
    google:
      # 쉼표로 여러 개. 안드로이드 Credential Manager 는 "웹 애플리케이션" 클라이언트 ID 를 aud 로 쓴다.
      client-ids: ${GOOGLE_CLIENT_IDS}
    apple:
      # Apple 로그인(docs/superpowers/specs/2026-10-29-apple-sign-in-design.md) — 번들 ID 가 비면 /api/auth/oauth/apple 은 401.
      # 팀·키·.p8 이 비면 로그인만 되고, 탈퇴 때 Apple 연결 끊기를 건너뛴다(로그).
      client-ids: ${APPLE_CLIENT_IDS:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
      # Android Apple 로그인(웹 흐름, 설계 §9) — Services ID 와 그 Return URL(= 이 서버의 /api/auth/oauth/apple/callback).
      # Return URL 은 앱 gradle.properties trex.appleRedirectUri 와 글자까지 같아야 한다. 비면 Android 로그인 토큰을 받지 않는다.
      web-client-id: ${APPLE_WEB_CLIENT_ID:}
      web-redirect-uri: ${APPLE_WEB_REDIRECT_URI:}
      # 콜백이 되돌려 보낼 Android 앱 패키지
      android-package: ${APPLE_ANDROID_PACKAGE:com.example.trex_kotlin}
  community:
    # 사진 버킷(비공개, 시드니). 자격 증명은 EC2 인스턴스 역할 — 키를 .env 에 넣지 않는다
    s3-bucket: ${COMMUNITY_S3_BUCKET:}
    require-s3: true
    # 관리자 loginId(쉼표, google_<sub>) — 앱 안 신고함·숨김·삭제·정지
    admin-login-ids: ${COMMUNITY_ADMIN_LOGIN_IDS:}
    # 새 신고를 알릴 디스코드 웹후크(비밀값). 비면 알리지 않는다
    report-webhook-url: ${COMMUNITY_REPORT_WEBHOOK_URL:}
