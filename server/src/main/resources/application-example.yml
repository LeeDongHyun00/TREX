# application.yml 템플릿.
# 이 파일을 application.yml 로 복사한 뒤 각 환경에 맞게 값을 채운다.
# 실제 application.yml 은 .gitignore 처리되어 커밋되지 않는다 (시크릿 포함 가능).

spring:
  datasource:
    # DB_CLOSE_DELAY=-1: 모든 커넥션이 닫혀도(유휴 커넥션 교체 등) 인메모리 DB가 소멸하지 않게 유지
    url: jdbc:h2:mem:trex_db;MODE=PostgreSQL;DB_CLOSE_DELAY=-1 # 메모리에 trex_db라는 임시 DB 생성 (PostgreSQL 호환 모드)
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create # 서버가 켤 때마다 기존 테이블을 지우고 Entity를 바탕으로 새로 생성
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  servlet:
    multipart:
      # 커뮤니티 사진: 장당 2MB, 글 하나(사진 5장 + 본문) 11MB 까지. 넘으면 413.
      max-file-size: 2MB
      max-request-size: 11MB

  h2:
    console:
      enabled: true # 웹 브라우저에서 눈으로 DB 테이블을 확인할 수 있게 해줌

jwt:
  # 운영 환경에서는 반드시 JWT_SECRET 환경변수로 주입한다. HS256 기준 최소 32바이트 이상.
  secret: ${JWT_SECRET:CHANGE_ME_local_dev_secret_at_least_32_bytes_long}
  expiration_time: 86400000

trex:
  oauth:
    google:
      # 구글 로그인 검증용 클라이언트 ID(쉼표로 여러 개). 비우면 /api/auth/oauth/google 이 401 을 낸다.
      client-ids: ${GOOGLE_CLIENT_IDS:}
    apple:
      # Apple 로그인(docs/superpowers/specs/2026-10-29-apple-sign-in-design.md) — 번들 ID 가 비면 /api/auth/oauth/apple 은 401.
      # 팀·키·.p8 이 비면 로그인만 되고, 탈퇴 때 Apple 연결 끊기를 건너뛴다(로그).
      client-ids: ${APPLE_CLIENT_IDS:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
  community:
    # 비우면 사진은 메모리에만(재시작하면 사라진다). 관리자·웹후크도 선택
    s3-bucket: ${COMMUNITY_S3_BUCKET:}
    admin-login-ids: ${COMMUNITY_ADMIN_LOGIN_IDS:}
    report-webhook-url: ${COMMUNITY_REPORT_WEBHOOK_URL:}
