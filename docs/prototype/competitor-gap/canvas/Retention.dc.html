<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기록 보관 기간 시트</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#F5F7F1;color:#1F2618;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#4A6329;text-decoration:none}a:hover{color:#1F2618}
.eb{font-size:12px;color:#5E6754;margin:0;line-height:1.4}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:#E5EDD9;color:#4A6329;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:#5F7D39;color:#fff;font-size:15px;font-weight:600;border:0;font-family:inherit;cursor:pointer;width:100%;flex:none;padding:0 16px;box-sizing:border-box}
.btn.ghost{background:#fff;color:#1F2618;border:1px solid rgba(31,38,24,.14)}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#5E6754;cursor:pointer;flex:none;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;min-height:60px;border-top:1px solid rgba(31,38,24,.08);font-size:15px;cursor:pointer;gap:10px;position:relative}
.opt:first-child{border-top:0}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt .r{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(31,38,24,.35);flex:none;box-sizing:border-box}
.opt.on .r{border:7px solid #5F7D39}
.warn{font-size:12px;color:#7A5A10;background:#F7EBD0;border-radius:12px;padding:10px 12px;line-height:1.5;margin:0}
.scrim{position:absolute;inset:0;background:rgba(31,38,24,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F7F1;border-radius:28px 28px 0 0;padding:8px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.handle{width:36px;height:4px;border-radius:2px;background:rgba(31,38,24,.18);margin:0 auto}
</style>
</helmet>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#9FA69A">
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-labelledby="t">
    <div class="handle"></div>
    <div class="row" style="margin-right:-10px"><h1 id="t" style="margin:0;font-size:18px;font-weight:700">기록 보관 기간</h1><a href="Settings.dc.html" class="ib" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <p class="eb">운동 기록을 이 기기와 백업에 얼마나 둘지 정해요. 근육 피로도는 어느 쪽이든 최근 7일만 계산해요.</p>

    <div style="background:#fff;border-radius:18px;padding:0 16px" role="radiogroup" aria-label="보관 기간">
      <label class="opt"><span>7일<br><span class="eb">지금까지의 기본</span></span><input type="radio" name="ret"><span class="r"></span></label>
      <label class="opt"><span>90일</span><input type="radio" name="ret"><span class="r"></span></label>
      <label class="opt"><span>1년</span><input type="radio" name="ret"><span class="r"></span></label>
      <label class="opt on"><span>제한 없음 <span class="chip">추천</span><br><span class="eb">달력·추이·연속 일수가 온전해요</span></span><input type="radio" name="ret" checked><span class="r"></span></label>
    </div>

    <p class="warn">기간을 줄이면 그 밖의 운동 기록이 이 기기와 백업에서 지워져요. 지우기 전에 내보내기를 권해요.</p>
    <a href="Export.dc.html" class="btn ghost">먼저 내보내기</a>
    <a href="Settings.dc.html" class="btn">저장하기</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
