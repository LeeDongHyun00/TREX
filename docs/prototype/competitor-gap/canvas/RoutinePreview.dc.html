<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#F5F7F1;color:#1F2618;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#4A6329;text-decoration:none}a:hover{color:#1F2618}
.eb{font-size:12px;color:#5E6754;margin:0;line-height:1.4}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:#E5EDD9;color:#4A6329;white-space:nowrap}
.chip.gray{background:#ECEEE8;color:#5E6754}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:#5F7D39;color:#fff;font-size:15px;font-weight:600;border:0;font-family:inherit;cursor:pointer;width:100%;flex:none;padding:0 16px;box-sizing:border-box}
.btn.ghost{background:#fff;color:#1F2618;border:1px solid rgba(31,38,24,.14)}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#5E6754;cursor:pointer;flex:none;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.it{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-top:1px solid rgba(31,38,24,.08);gap:10px;font-size:14px}
.it:first-child{border-top:0}
.scrim{position:absolute;inset:0;background:rgba(31,38,24,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F7F1;border-radius:28px 28px 0 0;padding:8px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:780px}
.handle{width:36px;height:4px;border-radius:2px;background:rgba(31,38,24,.18);margin:0 auto}
</style>

<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#9FA69A">
  <div class="scrim"></div>

    <div class="handle"></div>
    <div class="row" style="margin-right:-10px"><div><p class="eb">추천 루틴 · 상하체 분할</p><h1 id="t" style="margin:2px 0 0;font-size:18px;font-weight:700">상하체 분할 A · 하체</h1></div><a href="Routines.dc.html" class="ib" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>

    <div style="background:#fff;border-radius:18px;padding:14px 16px">
      <div class="row"><span class="eb">6종목 · 18세트 · 약 42분</span><span class="chip">자세 교정 5 / 6</span></div>
      <div style="display:flex;height:12px;border-radius:999px;overflow:hidden;margin-top:10px" role="img" aria-label="부위 비중: 하체 70%, 코어 30%"><i style="width:70%;background:#5F7D39"></i><i style="width:30%;background:#A8C47C"></i></div>
      <div style="display:flex;gap:14px;font-size:12px;color:#5E6754;margin-top:8px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#5F7D39;margin-right:4px"></i>하체 70%</span><span><i style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#A8C47C;margin-right:4px"></i>코어 30%</span></div>
    </div>

    <div style="background:#fff;border-radius:18px;padding:0 16px;overflow:auto;flex:1;min-height:0">
      <div class="it"><span><b>기본 스쿼트</b> <span class="chip">자세 교정</span></span><span class="eb">3 × 10</span></div>
      <div class="it"><span><b>런지</b> <span class="chip">자세 교정</span></span><span class="eb">3 × 12</span></div>
      <div class="it"><span><b>굿모닝</b> <span class="chip">자세 교정</span></span><span class="eb">3 × 12</span></div>
      <div class="it"><span><b>레그 프레스</b> <span class="chip gray">기록 전용</span></span><span class="eb">3 × 12</span></div>
      <div class="it"><span><b>플랭크</b> <span class="chip">자세 교정</span></span><span class="eb">3 × 45초</span></div>
      <div class="it"><span><b>레그 레이즈</b> <span class="chip">자세 교정</span></span><span class="eb">3 × 15</span></div>
    </div>
    <p class="eb">무게는 처음엔 비어 있어요. 첫 세트에서 적으면 다음부터 '지난번' 으로 채워 드려요.</p>

    <a href="Weekly.dc.html" class="btn">요일에 넣기</a>
    <div style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:8px">
      <a href="Weekly.dc.html" class="btn ghost" style="min-height:44px;font-size:14px">오늘 루틴으로</a>
      <button type="button" class="btn ghost" style="min-height:44px;font-size:14px">보관함에 저장</button>
    </div>
  </div>
</div>
