<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>알림 설정 시트</title>
</head>
<body style="background:#E9ECE4;display:flex;justify-content:center;padding:24px 0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#F5F7F1;color:#1F2618;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#4A6329;text-decoration:none}a:hover{color:#1F2618}
.eb{font-size:12px;color:#5E6754;margin:0;line-height:1.4}
.chip{display:inline-flex;align-items:center;min-height:24px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:500;background:#ECEEE8;color:#5E6754;white-space:nowrap}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#5E6754;cursor:pointer;flex:none;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.it{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-top:1px solid rgba(31,38,24,.08);gap:12px;font-size:15px}
.it:first-child{border-top:0}
.sw{position:relative;width:52px;height:44px;flex:none;display:block;cursor:pointer}
.sw input{position:absolute;opacity:0;width:1px;height:1px}
.sw span{position:absolute;left:0;right:0;top:6px;bottom:6px;border-radius:999px;background:rgba(31,38,24,.22)}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff}
.sw.on span{background:#5F7D39}.sw.on span::after{left:23px}
.days{display:flex;gap:4px;margin-top:6px}.days span{flex:1;text-align:center;font-size:12px;padding:5px 0;border-radius:7px;background:#ECEEE8;color:#5E6754}.days span.on{background:#A8C47C;color:#1F2618;font-weight:600}
.scrim{position:absolute;inset:0;background:rgba(31,38,24,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F7F1;border-radius:28px 28px 0 0;padding:8px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.handle{width:36px;height:4px;border-radius:2px;background:rgba(31,38,24,.18);margin:0 auto}
</style>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#9FA69A">
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-labelledby="t">
    <div class="handle"></div>
    <div class="row" style="margin-right:-10px"><h1 id="t" style="margin:0;font-size:18px;font-weight:700">알림</h1><a href="Settings.html" class="ib" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>

    <a href="Settings.html" style="background:#E5EDD9;border-radius:14px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;color:#4A6329">
      <span>알림 권한 · 허용됨</span><span style="display:flex;align-items:center;gap:4px;font-size:13px">시스템 설정<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span>
    </a>

    <div style="background:#fff;border-radius:18px;padding:0 16px">
      <div class="it"><div><label for="n1" style="margin:0;display:block">운동 요일 알림</label><p class="eb">월·수·금·토 19:30 · 요일은 주간 루틴과 같아요</p><div class="days" aria-hidden="true"><span class="on">월</span><span>화</span><span class="on">수</span><span>목</span><span class="on">금</span><span class="on">토</span><span>일</span></div></div><label class="sw on"><input id="n1" type="checkbox" checked><span></span></label></div>
      <div class="it"><div><label for="n2" style="margin:0;display:block">휴식 끝</label><p class="eb">세트 사이 휴식이 끝날 때, 화면이 꺼져 있으면</p></div><label class="sw on"><input id="n2" type="checkbox" checked><span></span></label></div>
      <div class="it"><div><label for="n3" style="margin:0;display:block">개인 기록 · 연속 운동</label><p class="eb">PR 을 세웠을 때, 목표 요일 저녁에 "오늘 운동하면 연속 13일" 한 번</p></div><label class="sw"><input id="n3" type="checkbox"><span></span></label></div>
      <div class="it"><div><p style="margin:0;color:#5E6754">커뮤니티</p><p class="eb">좋아요·댓글 알림은 아직 없어요</p></div><span class="chip">없음</span></div>
    </div>

    <p class="eb">알림은 기기 안에서만 예약돼요. 서버가 보내는 푸시가 아니고, 끊긴 연속을 돈으로 되살리는 기능은 없어요.</p>
  </div>
</div>
</body>
</html>
