<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>종목 직접 추가 시트</title>
</head>
<body style="background:#E9ECE4;display:flex;justify-content:center;padding:24px 0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#F5F7F1;color:#1F2618;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#4A6329;text-decoration:none}a:hover{color:#1F2618}
.eb{font-size:12px;color:#5E6754;margin:0;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:#5F7D39;color:#fff;font-size:15px;font-weight:600;border:0;font-family:inherit;cursor:pointer;width:100%;flex:none;padding:0 16px;box-sizing:border-box}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#5E6754;cursor:pointer;flex:none;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.lbl{font-size:12px;color:#5E6754;margin:0 0 6px;display:block}
.in{width:100%;box-sizing:border-box;height:48px;border-radius:12px;border:1px solid rgba(31,38,24,.16);background:#fff;padding:0 14px;font-size:15px;font-family:inherit;color:#1F2618}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs label{min-height:44px;padding:0 14px;border-radius:999px;background:#fff;font-size:13px;color:#5E6754;border:1px solid rgba(31,38,24,.14);display:flex;align-items:center;cursor:pointer;position:relative;box-sizing:border-box}
.tabs label.on{background:#1F2618;color:#fff;border-color:#1F2618}
.tabs input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:12px;color:#5E6754;background:#ECEEE8;border-radius:10px;padding:8px 10px;line-height:1.5;margin:0}
.scrim{position:absolute;inset:0;background:rgba(31,38,24,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F7F1;border-radius:28px 28px 0 0;padding:8px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.handle{width:36px;height:4px;border-radius:2px;background:rgba(31,38,24,.18);margin:0 auto}
</style>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#9FA69A">
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-labelledby="t">
    <div class="handle"></div>
    <div class="row" style="margin-right:-10px"><h1 id="t" style="margin:0;font-size:18px;font-weight:700">종목 직접 추가</h1><a href="Catalog.html" class="ib" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>
    <p class="note">내 기록에만 쓰여요. 자세 비교와 근육 부하 추정은 되지 않아요. 주 근육을 고르면 고른 근육으로만 대략 추정해요.</p>

    <div><label class="lbl" for="nm">이름 · 1~30자</label><input id="nm" class="in" value="펜들레이 로우"><p class="eb" style="margin-top:6px">비슷한 이름이 있어요: 바벨 로우(기록 전용)</p></div>

    <div><span class="lbl" id="l-bp">부위 · 필수</span><div class="tabs" role="radiogroup" aria-labelledby="l-bp"><label class="on"><input type="radio" name="bp" checked>등</label><label><input type="radio" name="bp">하체</label><label><input type="radio" name="bp">가슴</label><label><input type="radio" name="bp">어깨</label><label><input type="radio" name="bp">팔</label><label><input type="radio" name="bp">코어</label><label><input type="radio" name="bp">유산소</label></div></div>

    <div><span class="lbl" id="l-eq">기구 · 필수</span><div class="tabs" role="radiogroup" aria-labelledby="l-eq"><label class="on"><input type="radio" name="eq" checked>바벨</label><label><input type="radio" name="eq">덤벨</label><label><input type="radio" name="eq">머신</label><label><input type="radio" name="eq">케이블</label><label><input type="radio" name="eq">맨몸</label></div></div>

    <div><span class="lbl" id="l-m">주 근육 · 선택</span><div class="tabs" role="group" aria-labelledby="l-m"><label class="on"><input type="checkbox" checked>광배근</label><label class="on"><input type="checkbox" checked>승모근</label><label><input type="checkbox">척추기립근</label><label><input type="checkbox">이두</label><label><input type="checkbox">후면 삼각근</label></div></div>

    <div><span class="lbl" id="l-u">단위</span><div class="tabs" role="radiogroup" aria-labelledby="l-u"><label class="on"><input type="radio" name="u" checked>횟수 · 무게</label><label><input type="radio" name="u">시간</label></div></div>

    <a href="Catalog.html" class="btn">추가하기</a>
  </div>
</div>
</body>
</html>
