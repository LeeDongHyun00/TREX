<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>기록 내보내기 시트</title>
</head>
<body style="background:#E9ECE4;display:flex;justify-content:center;padding:24px 0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
body{margin:0;background:#F5F7F1;color:#1F2618;font-family:"Noto Sans KR",system-ui,sans-serif;font-size:14px;line-height:1.45}
a{color:#4A6329;text-decoration:none}a:hover{color:#1F2618}
.eb{font-size:12px;color:#5E6754;margin:0;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:14px;background:#5F7D39;color:#fff;font-size:15px;font-weight:600;border:0;font-family:inherit;cursor:pointer;width:100%;flex:none;padding:0 16px;box-sizing:border-box}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:#5E6754;cursor:pointer;flex:none;font-family:inherit}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.seg{display:flex;gap:8px}
.seg label{flex:1;min-height:48px;border-radius:12px;border:1px solid rgba(31,38,24,.14);background:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;color:#5E6754;cursor:pointer;position:relative}
.seg label.on{background:#1F2618;color:#fff;border-color:#1F2618}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.ck{display:flex;align-items:center;justify-content:space-between;min-height:56px;border-top:1px solid rgba(31,38,24,.08);font-size:15px;cursor:pointer;position:relative;gap:10px}
.ck:first-child{border-top:0}
.ck input{position:absolute;opacity:0;width:1px;height:1px}
.ck .b{width:24px;height:24px;border-radius:7px;border:1.5px solid rgba(31,38,24,.35);box-sizing:border-box;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ck.on .b{background:#5F7D39;border-color:#5F7D39}
.scrim{position:absolute;inset:0;background:rgba(31,38,24,.35)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F5F7F1;border-radius:28px 28px 0 0;padding:8px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.handle{width:36px;height:4px;border-radius:2px;background:rgba(31,38,24,.18);margin:0 auto}
</style>
<div style="width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#9FA69A">
  <div class="scrim"></div>
  <div class="sheet" role="dialog" aria-labelledby="t">
    <div class="handle"></div>
    <div class="row" style="margin-right:-10px"><h1 id="t" style="margin:0;font-size:18px;font-weight:700">기록 내보내기</h1><a href="Settings.html" class="ib" aria-label="닫기"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a></div>

    <div><p class="eb" style="margin-bottom:6px">형식</p>
      <div class="seg" role="radiogroup" aria-label="형식"><label class="on"><input type="radio" name="fmt" checked>CSV</label><label><input type="radio" name="fmt">JSON</label></div>
      <p class="eb" style="margin-top:6px">CSV 열: 날짜 · 종목 · 세트 · kg · 회 · 카메라 횟수 · 초 · RPE · 출처 · 메모</p></div>

    <div><p class="eb" style="margin-bottom:6px">기간</p>
      <div class="seg" role="radiogroup" aria-label="기간"><label class="on"><input type="radio" name="rng" checked>전체</label><label><input type="radio" name="rng">올해</label><label><input type="radio" name="rng">최근 90일</label></div></div>

    <div><p class="eb" style="margin-bottom:6px">포함</p>
      <div style="background:#fff;border-radius:18px;padding:0 16px">
        <label class="ck on"><span>운동 기록 <span class="eb">218일 · 1,904세트</span></span><input type="checkbox" checked><span class="b"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg></span></label>
        <label class="ck on"><span>체중 기록 <span class="eb">41건</span></span><input type="checkbox" checked><span class="b"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M5 12l4 4L19 6"/></svg></span></label>
        <label class="ck"><span>식단 기록 <span class="eb">끼니·영양</span></span><input type="checkbox"><span class="b"></span></label>
      </div>
      <p class="eb" style="margin-top:8px">자세 판정 원본(관절 좌표)과 음식 사진은 포함되지 않아요 — 기기 밖으로 내보내지 않습니다.</p></div>

    <a href="Settings.html" class="btn">내보내기</a>
  </div>
</div>
</body>
</html>
