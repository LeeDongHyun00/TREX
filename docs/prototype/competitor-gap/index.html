<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TREX 격차 프로토타입</title>
<style>
  /* 앱 테마(TrexTheme.kt)와 같은 색 */
  :root{
    --dark:#1F2618; --dark2:#2B3424; --green:#759848; --deep:#5F7D39; --soft:#A8C47C; --lime:#C7E26B;
    --bg:#F5F7F1; --text:#1F2618; --text2:#5E6754; --warn:#D78B28; --err:#C65454; --amber:#D9A441; --card:#FFFFFF;
    --line:rgba(31,38,24,.08);
  }
  *{box-sizing:border-box} html,body{margin:0;background:#E9ECE4;font-family:-apple-system,"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:var(--text)}
  body{padding:24px 16px 48px}
  h1{font-size:18px;margin:0 0 4px} .sub{color:var(--text2);font-size:13px;margin:0 0 16px}
  .picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .picker button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;color:var(--text2)}
  .picker button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  .stage{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .phone{position:relative;width:340px;height:700px;border-radius:44px;background:var(--dark);padding:6px;box-shadow:0 30px 60px -20px rgba(31,38,24,.45);flex:none}
  .notch{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:110px;height:26px;background:var(--dark);border-radius:999px;z-index:20}
  .screen{position:relative;width:100%;height:100%;border-radius:38px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
  .content{flex:1;overflow-y:auto;padding:48px 18px 90px}
  .content::-webkit-scrollbar{width:0}
  .eyebrow{font-size:12px;color:var(--text2)} h2{font-size:22px;font-weight:600;margin:2px 0 14px;line-height:1.25}
  h3{font-size:15px;font-weight:600;margin:18px 0 8px}
  .card{background:var(--card);border-radius:20px;padding:14px 16px;box-shadow:0 1px 2px rgba(31,38,24,.05);margin-bottom:10px}
  .card.dark{background:var(--dark);color:#fff} .card.dark .eyebrow{color:rgba(255,255,255,.6)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .muted{color:var(--text2);font-size:12px} .small{font-size:12px}
  .chip{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;background:rgba(168,196,124,.3);color:var(--deep)}
  .chip.gray{background:rgba(31,38,24,.06);color:var(--text2)} .chip.warn{background:rgba(215,139,40,.15);color:var(--warn)} .chip.amber{background:rgba(217,164,65,.18);color:#8A6412} .chip.err{background:rgba(198,84,84,.12);color:var(--err)}
  .btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;padding:12px 16px;font-size:14px;font-weight:600;cursor:pointer;background:var(--green);color:#fff;width:100%}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)} .btn.sm{padding:8px 12px;font-size:12px;width:auto;border-radius:10px} .btn.dark{background:var(--dark)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .big{font-size:26px;font-weight:600;line-height:1.1}
  .nav{position:absolute;left:0;right:0;bottom:0;height:72px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:0 8px 8px}
  .nav div{font-size:10px;color:var(--text2);display:flex;flex-direction:column;align-items:center;gap:3px} .nav div.on{color:var(--deep);font-weight:600}
  .nav i{width:22px;height:22px;border-radius:7px;background:rgba(31,38,24,.08);display:block} .nav div.on i{background:var(--soft)}
  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px} .tabs span{flex:none;padding:7px 12px;border-radius:999px;background:#fff;font-size:12px;color:var(--text2);border:1px solid var(--line)} .tabs span.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  /* calendar */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:12px}
  .cal .h{color:var(--text2);font-size:11px;padding:4px 0}
  .cal .d{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--text)}
  .cal .d.o{color:rgba(31,38,24,.3)} .cal .d .dot{width:5px;height:5px;border-radius:50%;background:transparent} .cal .d.w .dot{background:var(--green)} .cal .d.r .dot{background:var(--soft)}
  .cal .d.sel{background:var(--dark);color:#fff} .cal .d.today{box-shadow:inset 0 0 0 1.5px var(--green)}
  .bar{height:8px;border-radius:999px;background:rgba(31,38,24,.08);overflow:hidden} .bar i{display:block;height:100%;background:var(--green);border-radius:999px}
  .stack{display:flex;height:10px;border-radius:999px;overflow:hidden} .stack i{display:block;height:100%}
  .list .it{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)} .list .it:first-child{border-top:0}
  .set{display:grid;grid-template-columns:28px 1fr 1fr 1fr 34px;gap:6px;align-items:center;padding:6px 0;font-size:13px}
  .set input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 6px;font-size:14px;text-align:center;background:#fff;color:var(--text)}
  .set .n{color:var(--text2);font-size:12px} .set .ok{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--soft);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--deep);cursor:pointer} .set .ok.on{background:var(--green);border-color:var(--green);color:#fff}
  .rpe{display:flex;gap:4px} .rpe span{flex:1;text-align:center;font-size:11px;padding:6px 0;border-radius:8px;background:#fff;border:1px solid var(--line);cursor:pointer;color:var(--text2)} .rpe span.on{background:var(--dark);color:#fff;border-color:var(--dark)}
  textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:13px;font-family:inherit;background:#fff;resize:none;color:var(--text)}
  .badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px} .badge{background:#fff;border-radius:16px;padding:12px 6px;text-align:center;font-size:11px;color:var(--text2);box-shadow:0 1px 2px rgba(31,38,24,.05)} .badge b{display:block;width:40px;height:40px;border-radius:50%;margin:0 auto 6px;background:var(--lime);display:flex;align-items:center;justify-content:center;font-size:18px} .badge.off{opacity:.45} .badge.off b{background:rgba(31,38,24,.08)}
  .radio{display:flex;flex-direction:column} .radio label{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer} .radio label:first-child{border-top:0}
  .radio i{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(31,38,24,.3);display:block} .radio label.on i{border:5px solid var(--green)}
  .toggle{width:40px;height:24px;border-radius:999px;background:rgba(31,38,24,.15);position:relative;cursor:pointer;flex:none} .toggle::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s} .toggle.on{background:var(--green)} .toggle.on::after{left:19px}
  .banner{background:linear-gradient(135deg,var(--deep),var(--green));color:#fff;border-radius:20px;padding:16px;margin-bottom:10px}
  .banner .big{font-size:22px}
  .days{display:flex;gap:6px} .days span{flex:1;text-align:center;font-size:11px;padding:8px 0;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--text2)} .days span.on{background:var(--soft);color:var(--dark);border-color:var(--soft);font-weight:600}
  .note{font-size:11px;color:var(--text2);background:rgba(31,38,24,.04);border-radius:10px;padding:8px 10px;margin-top:8px}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:28px 28px 0 0;padding:14px 18px 28px;box-shadow:0 -10px 30px rgba(31,38,24,.18);z-index:30;display:none} .sheet.on{display:block} .sheet .handle{width:36px;height:4px;border-radius:2px;background:rgba(31,38,24,.15);margin:0 auto 12px}
  .side{max-width:420px;font-size:13px;color:var(--text2);line-height:1.55} .side h4{margin:0 0 6px;color:var(--text);font-size:14px} .side ul{padding-left:18px;margin:0 0 10px} .side code{background:#fff;padding:1px 5px;border-radius:5px;font-size:12px}
  .pill-lvl{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;font-size:12px}
  svg.chart{width:100%;height:120px;display:block}
  .legend{display:flex;gap:10px;font-size:11px;color:var(--text2);margin-top:6px} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  @media (max-width:760px){.stage{flex-direction:column}}
</style>
</head>
<body>
<h1>TREX 격차 프로토타입 (2026-11-05)</h1>
<p class="sub">`docs/COMPETITOR_GAP_LIFTOFF_FLEEK.md` G1~G11 의 화면 설계. 색·모양은 앱 테마(`TrexTheme.kt`)와 같다. 숫자는 예시 데이터이고 판정·점수는 들어 있지 않다.</p>
<div class="picker" id="picker"></div>

<div class="stage">
<div class="phone"><div class="notch"></div><div class="screen" id="screen"></div></div>
<div class="side" id="side"></div>
</div>

<script>
// ---------- 화면 정의 ----------
const screens = {
record: {
  title: "G1·G3 기록(달력)", nav: "기록",
  side: `<h4>무엇이 바뀌나</h4><ul><li>'최근 7일' 막대 → <b>월 달력</b>. 운동한 날은 진한 점, 쉬는 날(목표 요일 아님)은 연한 점.</li><li>날짜를 누르면 그날 카드. 세트×무게가 보이고 '기록 추가' 로 세션 밖 수동 기록(G9).</li><li>주간 요약: 운동일·세트·볼륨·부위 비중. 볼륨은 <b>사용자가 확정한 횟수</b>로만 계산하고 자동 카운트만 있는 세트는 '추정'.</li><li>자세 항목은 점수 그래프가 아니라 문장으로 남긴다(원칙 #1).</li></ul><h4>전제</h4><ul><li>보관 기간 분리(G1) — 설정 화면 참조.</li></ul>`,
  html: () => `
    <p class="eyebrow">운동 기록</p><h2>11월</h2>
    <div class="card">
      <div class="row"><span class="muted">◀ 10월</span><b>2026년 11월</b><span class="muted">12월 ▶</span></div>
      <div class="cal" id="cal" style="margin-top:10px"></div>
      <div class="legend"><span><i style="background:var(--green)"></i>운동한 날</span><span><i style="background:var(--soft)"></i>계획된 휴식</span><span><i style="background:transparent;box-shadow:inset 0 0 0 1.5px var(--green)"></i>오늘</span></div>
    </div>
    <div class="card dark"><div class="row"><div><p class="eyebrow">연속 운동</p><p class="big">12일</p></div><div style="text-align:right"><p class="eyebrow">이번 주 목표</p><p class="big">3/4일</p></div></div><p class="muted" style="color:rgba(255,255,255,.6);margin:8px 0 0">목표 요일(월·수·금·토)만 셉니다. 목표가 아닌 날은 끊기지 않아요.</p></div>
    <h3>11월 5일 (목) · 오늘</h3>
    <div class="card list">
      <div class="it"><div><b>기본 스쿼트</b> <span class="chip">자세 교정</span><p class="muted">60 kg × 10 · 10 · 8 · 세트 3</p></div><span class="chip amber">PR</span></div>
      <div class="it"><div><b>덤벨 컬</b> <span class="chip">자세 교정</span><p class="muted">12 kg × 12 · 12 · 10 · 팔꿈치 앞 이탈 1회 뺌</p></div><span class="muted">RPE 8</span></div>
      <div class="it"><div><b>랫풀다운</b> <span class="chip gray">기록 전용</span><p class="muted">45 kg × 12 · 12 · 12</p></div><span class="muted">메모 1</span></div>
      <div style="padding-top:10px"><button class="btn ghost sm" onclick="sheet('manual')">+ 기록 추가 · 수정</button></div>
    </div>
    <h3>이번 주 요약</h3>
    <div class="card">
      <div class="grid2"><div><p class="muted">운동일 · 세트</p><p class="big" style="font-size:20px">3일 · 27세트</p></div><div><p class="muted">볼륨</p><p class="big" style="font-size:20px">4,120 kg <span class="chip gray">추정 2세트</span></p></div></div>
      <p class="muted" style="margin:12px 0 6px">부위 비중</p>
      <div class="stack"><i style="width:48%;background:var(--deep)"></i><i style="width:32%;background:var(--green)"></i><i style="width:20%;background:var(--soft)"></i></div>
      <div class="legend"><span><i style="background:var(--deep)"></i>하체 48%</span><span><i style="background:var(--green)"></i>상체 32%</span><span><i style="background:var(--soft)"></i>코어 20%</span></div>
      <div class="note">비중은 세트당 운동 시간 합산의 제품용 분류입니다. 생리학적 측정값이 아니에요.</div>
    </div>
    <div class="sheet" id="sheet-manual"><div class="handle"></div><b>기록 추가</b><p class="muted">카메라·타이머 없이 적는 기록이에요. 자세 판정은 남지 않아요.</p>
      <div class="row" style="margin:10px 0"><span class="small">날짜</span><span class="chip gray">11월 5일 (목)</span></div>
      <div class="row" style="margin:10px 0"><span class="small">종목</span><span class="chip gray">종목 선택 ▸</span></div>
      <div class="set"><span class="n">세트</span><span class="n" style="text-align:center">kg</span><span class="n" style="text-align:center">회</span><span class="n" style="text-align:center">RPE</span><span></span></div>
      <div class="set"><span class="n">1</span><input value="40"><input value="12"><input value="7"><span class="ok on">✓</span></div>
      <button class="btn" style="margin-top:10px" onclick="sheet('manual')">저장</button></div>`
},
exercise: {
  title: "G3 종목 상세", nav: "운동",
  side: `<h4>무엇이 바뀌나</h4><ul><li>카탈로그 행·기록 카드에서 들어오는 <b>종목 페이지</b>. 최고 무게, 추정 1RM, 최근 세션 추이, 세트 이력.</li><li>추정 1RM 은 Epley 로 <b>횟수 ≤ 10 인 세트</b>에서만. 맨몸 종목은 횟수 추이만 그린다.</li><li>자세 교정 지원 여부와 가이드 진입은 지금 카탈로그 행과 같다.</li><li>Liftoff 식 '등급' 은 없다 — 모집단 분포가 없고 그 설계의 불만(무게 편중)이 크다.</li></ul>`,
  html: () => `
    <p class="eyebrow">하체 · 바벨</p><h2>기본 스쿼트 <span class="chip">자세 교정 지원</span></h2>
    <div class="grid2"><div class="card"><p class="muted">최고 무게</p><p class="big">60 kg</p><p class="muted">11월 5일 · 10회</p></div><div class="card"><p class="muted">추정 1RM</p><p class="big">80 kg</p><p class="muted">60 kg × 10 (Epley)</p></div></div>
    <div class="card"><div class="row"><b>최고 무게 추이</b><span class="chip gray">최근 8세션</span></div>
      <svg class="chart" viewBox="0 0 300 120" preserveAspectRatio="none">
        <polyline fill="none" stroke="#A8C47C" stroke-width="2" points="10,95 50,88 90,90 130,70 170,66 210,52 250,48 290,30"/>
        ${[[10,95],[50,88],[90,90],[130,70],[170,66],[210,52],[250,48]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#759848"/>`).join("")}
        <circle cx="290" cy="30" r="5" fill="#D9A441"/><text x="262" y="20" font-size="10" fill="#8A6412">PR 60</text>
        <text x="6" y="112" font-size="9" fill="#5E6754">10/12</text><text x="268" y="112" font-size="9" fill="#5E6754">11/5</text>
      </svg></div>
    <div class="card"><div class="row"><b>횟수 추이</b><span class="muted">자세 교정 세트 · 확정 횟수</span></div><div class="bar" style="margin-top:8px"><i style="width:72%"></i></div><p class="muted" style="margin-top:6px">최근 세트 평균 9.3회 · 뺀 회(무릎 안쪽 모임) 2회는 그래프에 넣지 않아요</p></div>
    <h3>세트 이력</h3>
    <div class="card list">
      ${[["11월 5일","60 × 10 · 10 · 8","PR"],["11월 3일","55 × 10 · 10 · 10",""],["11월 1일","55 × 10 · 9 · 9",""],["10월 29일","50 × 12 · 12 · 12",""],["10월 27일","50 × 12 · 12 · 10",""]].map(r=>`<div class="it"><div><b>${r[0]}</b><p class="muted">${r[1]}</p></div>${r[2]?'<span class="chip amber">PR</span>':''}</div>`).join("")}
    </div>
    <button class="btn ghost" onclick="go('setinput')">운동 가이드 · 주의사항</button>`
},
setinput: {
  title: "G2 세트 입력", nav: "운동",
  side: `<h4>무엇이 바뀌나</h4><ul><li>휴식 화면(세트 사이)에 <b>이전 세션 인라인</b> + '그대로 채우기'. 플릭의 '이전 기록으로 시작', Liftoff 의 inline previous sets.</li><li>세트 행: kg · 회 · RPE(선택). 0.5 kg 단위, 맨몸이면 kg 비움.</li><li>카메라 세션에서 자동 카운트가 있으면 '회' 칸에 미리 들어오고 사용자가 고치면 <code>actualReps</code> 로 확정된다.</li><li>종목별 메모(플릭에서 가장 칭찬받는 기능).</li></ul><h4>주의</h4><ul><li><code>PostureLiveSessionScreen</code> 에 지역 변수를 늘리지 않는다 — 입력 상태는 별도 홀더.</li></ul>`,
  html: () => `
    <p class="eyebrow">세트 사이 휴식 · 0:42</p><h2>기본 스쿼트 <span class="muted" style="font-size:14px">2 / 3 세트</span></h2>
    <div class="card"><div class="row"><div><p class="muted">지난번 (11월 3일)</p><b>55 kg × 10 · 10 · 10</b> <span class="muted">RPE 8</span></div><button class="btn sm dark" id="fill" onclick="fillPrev()">그대로 채우기</button></div></div>
    <div class="card">
      <div class="set"><span class="n">세트</span><span class="n" style="text-align:center">kg</span><span class="n" style="text-align:center">회</span><span class="n" style="text-align:center">RPE</span><span></span></div>
      <div class="set"><span class="n">1</span><input value="60" data-p="55"><input value="10" data-p="10"><input value="8" data-p="8"><span class="ok on">✓</span></div>

function render(id){
  const s = screens[id];
  document.getElementById("screen").innerHTML = `<div class="content">${s.html()}</div><div class="nav">${navs.map(n=>`<div class="${n==s.nav?'on':''}"><i></i>${n}</div>`).join("")}</div>`;

  document.querySelectorAll("#picker button").forEach(b=>b.classList.toggle("on",b.dataset.id==id));
  if(id=="record") buildCal();
  location.hash = id;
}

document.getElementById("picker").innerHTML = order.map(id=>`<button data-id="${id}" onclick="go('${id}')">${screens[id].title}</button>`).join("");
function buildCal(){
  const el = document.getElementById("cal"); if(!el) return;
  const h = ["월","화","수","목","금","토","일"].map(d=>`<div class="h">${d}</div>`).join("");
  // 2026-11-01 은 일요일
  const worked = [2,4,5,7,9,11,12,14,16,18,19,21,23,26,28,30].filter(d=>d<=5);
  const rest = [1,3];
  let cells = ""; for(let i=0;i<6;i++) cells += `<div class="d o">${26+i}</div>`;
  for(let d=1; d<=30; d++){
    const cls = ["d", worked.includes(d)?"w":"", rest.includes(d)?"r":"", d==5?"today sel":"", d>5?"o":""].join(" ");
    cells += `<div class="${cls}" onclick="selDay(this)">${d}<span class="dot"></span></div>`;
  }
  el.innerHTML = h + cells;
}
function selDay(el){ document.querySelectorAll("#cal .d.sel").forEach(d=>d.classList.remove("sel")); el.classList.add("sel"); }
function sheet(id){ document.getElementById("sheet-"+id).classList.toggle("on"); }
function fillPrev(){ document.querySelectorAll("#screen .set input[data-p]").forEach(i=>{ if(!i.value) i.value=i.dataset.p; }); document.getElementById("fill").textContent="채웠어요"; }
function pick(el){ el.parentNode.querySelectorAll("span").forEach(s=>s.classList.remove("on")); el.classList.add("on"); }
function radio(el){ el.parentNode.querySelectorAll("label").forEach(l=>l.classList.remove("on")); el.classList.add("on"); }
function dayPick(el){ el.parentNode.querySelectorAll("span").forEach(s=>s.classList.remove("on")); el.classList.add("on"); }
render(order.includes(location.hash.slice(1)) ? location.hash.slice(1) : "record");
</script>
</body>
</html>
