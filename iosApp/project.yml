name: Trex
options:
  deploymentTarget:
    iOS: '16.0'
  developmentLanguage: ko
settings:
  base:
    SWIFT_VERSION: '5.0'
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    IPHONEOS_DEPLOYMENT_TARGET: '16.0'
    CODE_SIGN_STYLE: Automatic
    # 앱 버전은 프로젝트에 한 번만(§121) — 앱에 넣는 TrexFoodRuntime.framework 도 같은 값이어야 App Store 검증이 통과한다
    # (프레임워크 Info.plist 에 CFBundleShortVersionString 이 없으면 업로드 거부). 배포 빌드 번호는 CI 가 CURRENT_PROJECT_VERSION 으로 덮는다.
    MARKETING_VERSION: '1.3.0'
    CURRENT_PROJECT_VERSION: '1'
    # Apple 로그인(Sign in with Apple) 엔타이틀먼트 — 개발자 계정에서 앱의 같은 기능도 켜야 서명된 빌드가 로그인한다
    CODE_SIGN_ENTITLEMENTS: Trex/Trex.entitlements
    TARGETED_DEVICE_FAMILY: '1'
    # TrexCore = 자세 엔진(posture-core) + Android 정본 Compose 화면(ios-ui) 한 프레임워크(§108).
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(SRCROOT)/../ios-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)'
targets:
  Trex:
    type: application
    platform: iOS
    dependencies:
      - target: TrexFoodRuntime
        embed: true
    sources:
      - path: Trex
        excludes: [Resources, Info.plist, Trex.entitlements]
      - path: TrexPostureDiagnostics/CaptureController.swift
      - path: TrexPostureDiagnostics/CaptureGate.swift
      - path: TrexPostureInference/PoseRunner.swift
      - path: TrexPostureInference/PoseOutput.swift
      - path: TrexPostureInference/LatestOnlyScheduler.swift
      - path: TrexPostureInference/OverlayProjection.swift
      - path: TrexPostureInference/BundleAssets.swift
      - path: Trex/Resources
        buildPhase: resources
      - path: ../app/src/main/assets/posture/pose_landmarker_full.task
      - path: ../app/src/main/assets/posture/face_landmarker.task
      - path: ../app/src/main/assets/posture/rules_mp_v0.json
      - path: ../app/src/main/assets/posture/rules_floor_v0.json
      - path: ../app/src/main/assets/posture/normal_pose_reference.tsv
      - path: TrexFoodModels/yolov8n_food.tflite
      - path: ../app/src/main/assets/models/food_region.tflite
      - path: ../app/src/main/assets/models/food_embed.tflite
      - path: ../app/src/main/assets/models/food_labels.txt
      - path: ../app/src/main/assets/exercise_guides
        type: folder
      - path: ../app/src/main/assets/muscle_load
        type: folder
      # §108 Phase 2: 공유 화면이 쓰는 Android 자산 — 루틴 그림·가이드북 SVG·로그인 공룡 그림(Android res/drawable-nodpi, §113)
      - path: ../app/src/main/assets/routine
        type: folder
      - path: ../app/src/main/assets/guid_img
        type: folder
      # 커뮤니티 기본 프로필 그림(Chromium 공룡, BSD-3 — 같은 폴더 NOTICE.txt)
      - path: ../app/src/main/assets/community
        type: folder
      - path: ../app/src/main/res/drawable-nodpi
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leedonghyun.trex.ios
        PRODUCT_NAME: Trex
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Trex/Info.plist
        # 실검증 도구(세트 로그·음성 기록·자가 라벨, 스펙 §116) — 저장소 코드로 빌드하면 YES, 배포 빌드만 xcodebuild … TREX_DEV_TOOLS=NO
        TREX_DEV_TOOLS: 'YES'
        TARGETED_DEVICE_FAMILY: '1'
        OTHER_LDFLAGS: '$(inherited) -framework TrexCore -ObjC -lc++'
        # Xcode 16(iOS 18 SDK) 로컬 빌드 전용(§108): Compose Multiplatform 1.11 은 iOS 26 SDK 로 빌드돼
        # UIKit 의 UIViewLayoutRegion 을 참조한다. 18 SDK 에는 없으니 링크 때 비워 두고 iOS 26+ 기기의 UIKit 이 채운다.
        # 그래서 이 조건으로 만든 빌드는 iOS 26 이상 기기 전용이다. Xcode 26(CI)에서는 이 줄이 적용되지 않는다.
        'OTHER_LDFLAGS[sdk=iphoneos18*]': '$(inherited) -Wl,-U,_OBJC_CLASS_$_UIViewLayoutRegion'
    preBuildScripts:
      - name: 공유 자세 엔진·화면 빌드
        basedOnDependencyAnalysis: false
        script: |
          set -e
          cd "$SRCROOT/.."
          python3 tools/sync_ios_core.py --check
          python3 tools/export_ios_resources.py --check
          # Xcode는 별도 Python을 사용할 수 있다. 전체 변환 검사는 setup-mac/CI에서 한다.
          python3 tools/prepare_ios_food_model.py --verify-hashes
          if [ "${OVERRIDE_KOTLIN_BUILD_IDE_SUPPORTED:-NO}" != "YES" ]; then
            bash gradlew -PiosOnly=true :ios-ui:embedAndSignAppleFrameworkForXcode
          fi
  TrexFoodRuntime:
    type: framework
    platform: iOS
    sources:
      - path: TrexFoodRuntime
        excludes: [exports.txt, PrivacyInfo.xcprivacy]
      # 개인정보 매니페스트(§121) — 링크된 TensorFlow Lite 의 stat/fstat 사유. 앱 쪽 매니페스트는 Trex/Resources 에 있다
      - path: TrexFoodRuntime/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leedonghyun.trex.foodruntime
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        EXPORTED_SYMBOLS_FILE: TrexFoodRuntime/exports.txt
        SKIP_INSTALL: YES
  TrexTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TrexTests]
    dependencies:
      - target: Trex
      - target: TrexFoodRuntime
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leedonghyun.trex.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        # 그래프는 호스팅 앱에 있다. Pod의 user_target_xcconfig force_load를 테스트에 상속하지 않는다.
        OTHER_LDFLAGS: ''
schemes:
  Trex:
    build:
      targets:
        Trex: all
    test:
      targets: [TrexTests]
